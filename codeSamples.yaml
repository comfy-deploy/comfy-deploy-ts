overlay: 1.0.0
info:
  title: CodeSamples overlay for typescript target
  version: 0.0.0
actions:
  - target: $["paths"]["/run/deployment/queue"]["post"]
    update:
      x-codeSamples:
        - lang: typescript
          label: SDK (TypeScript)
          source: |-
            import { ComfyDeploy } from "comfydeploy";

            const comfyDeploy = new ComfyDeploy({
              bearer: "<YOUR_BEARER_TOKEN_HERE>",
            });

            async function run() {
              const result = await comfyDeploy.run.deployment.queue({
                inputs: {
                  "num_inference_steps": 30,
                  "prompt": "A futuristic cityscape",
                  "seed": 123456,
                },
                webhook: "https://myapp.com/webhook",
                webhookIntermediateStatus: true,
                deploymentId: "12345678-1234-5678-1234-567812345678",
              });

              console.log(result);
            }

            run();
  - target: $["paths"]["/run/{run_id}"]["get"]
    update:
      x-codeSamples:
        - lang: typescript
          label: SDK (TypeScript)
          source: |-
            import { ComfyDeploy } from "comfydeploy";

            const comfyDeploy = new ComfyDeploy({
              bearer: "<YOUR_BEARER_TOKEN_HERE>",
            });

            async function run() {
              const result = await comfyDeploy.run.get({
                runId: "faf49b3a-7b64-4687-95c8-58ca8a41dd73",
              });

              console.log(result);
            }

            run();
  - target: $["paths"]["/run/{run_id}/cancel"]["post"]
    update:
      x-codeSamples:
        - lang: typescript
          label: SDK (TypeScript)
          source: |-
            import { ComfyDeploy } from "comfydeploy";

            const comfyDeploy = new ComfyDeploy({
              bearer: "<YOUR_BEARER_TOKEN_HERE>",
            });

            async function run() {
              const result = await comfyDeploy.run.cancel({
                runId: "<id>",
              });

              console.log(result);
            }

            run();
  - target: $["paths"]["{$request.body#/webhook}"]["post"]
    update:
      x-codeSamples:
        - lang: typescript
          label: SDK (TypeScript)
          source: |-
            import { ComfyDeploy } from "comfydeploy";

            const comfyDeploy = new ComfyDeploy();

            async function run() {
              const result = await comfyDeploy.callbacks.runUpdateRequestBodyWebhookPost({
                runId: "<id>",
                status: "running",
                liveStatus: "<value>",
              });

              console.log(result);
            }

            run();
